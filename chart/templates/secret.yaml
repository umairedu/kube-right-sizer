{{- if and .Values.slack.token (not .Values.slack.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "right-sizer.slackSecret" . }}
  labels:
    {{- include "right-sizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_TOKEN: {{ .Values.slack.token | quote }}
{{- end }}
