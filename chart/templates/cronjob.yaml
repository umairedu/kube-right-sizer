apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "right-sizer.name" . }}
  labels:
    {{- include "right-sizer.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "right-sizer.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "right-sizer.name" . }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: right-sizer
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                {{- if .Values.slack.channel }}
                - name: SLACK_CHANNEL
                  value: {{ .Values.slack.channel | quote }}
                - name: SLACK_VERIFY_SSL
                  value: {{ .Values.slack.verifySSL | quote }}
                - name: SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "right-sizer.slackSecret" . }}
                      key: SLACK_TOKEN
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
