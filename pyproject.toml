[project]
name = "kube-right-sizer"
version = "1.0.0"
description = "Right-size Kubernetes CPU and memory requests and limits from Prometheus usage history"
requires-python = ">=3.13"
dependencies = [
    "certifi==2026.11.20",
    "kubernetes==37.0.3",
    "pyyaml==6.0.4",
    "requests==2.34.2",
    "slack-sdk==3.48.0",
    "tabulate==0.10.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
